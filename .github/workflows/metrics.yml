name: Generate metrics

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Render metrics SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: B00H0O

          filename: metrics.svg
          committer_branch: output
          committer_message: "auto: refresh metrics"

          template: classic
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          config_timezone: Etc/UTC
          config_animations: yes
          config_padding: 6

          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

          extras_css: |
            :root {
              --color-text:       #F5F5F5;
              --color-background: #0A0A0A;
              --color-highlight:  #FF2A3A;
              --color-link:       #FF2A3A;
              --color-calendar-graph-day-bg:    #121212;
              --color-calendar-graph-day-L1-bg: #4A0510;
              --color-calendar-graph-day-L2-bg: #8A0C16;
              --color-calendar-graph-day-L3-bg: #C1121F;
              --color-calendar-graph-day-L4-bg: #FF2A3A;
            }
            svg, .header { background: #0A0A0A !important; }
            text { fill: #F5F5F5 !important; }
            .title, h2 { fill: #FF2A3A !important; color: #FF2A3A !important; }
            .highlight, .accent { fill: #FF2A3A !important; }
